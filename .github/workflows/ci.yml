name: CI-front

on:
  push:
    branches:
      - "*"
  pull_request:

jobs:
  ci-front:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
      - name: Install pnpm
        run: npm install -g pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Run frontend tests
        working-directory: ./frontend
        run: pnpm test
